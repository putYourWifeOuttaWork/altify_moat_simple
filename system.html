          const start = () => { if (!running) { running = true; raf = requestAnimationFrame(tick); } };
          const stop = () => { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; };
          const io = new IntersectionObserver((es) => es.forEach((e) => { e.isIntersecting ? start() : stop(); }), { threshold: 0.05 });
          io.observe(fig); this._observers.push(io); this._zonesStop = stop;
          this._finishers.push(() => { stop(); scaleG.setAttribute('transform', 'scale(1)'); });
        } catch (e) {}
      }
    }
  }

  componentWillUnmount() {
    if (this._memStop) this._memStop();
    if (this._zonesStop) this._zonesStop();
    if (this._zonesOnKey) document.removeEventListener('keydown', this._zonesOnKey);
    if (this._onPrint) window.removeEventListener('beforeprint', this._onPrint);
    (this._observers || []).forEach((o) => o.disconnect());
  }
}
</script>
